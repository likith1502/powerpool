services:
  - type: web
    name: powerpool-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COMPLIANCE
        value: "0.65"
      - key: MOCK_DATA
        value: "true"
